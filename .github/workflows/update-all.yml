name: IPTV 3 Länder Auto Repair

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: iptv-3-laender-master
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.12 installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ffmpeg und ffprobe installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Alle 3 Länder prüfen und reparieren
        id: repair
        continue-on-error: true
        run: python update_all.py

      - name: Ergebnisse speichern
        if: ${{ !cancelled() }}
        run: |
          git config user.name "iptv-3-laender-auto-bot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            IPTV_Samsung_AKTUELL.m3u \
            IPTV_Automatik_Report.txt \
            deutsche_sender_basis.m3u \
            oesterreichische_sender_basis.m3u \
            albanische_recovery_seed.m3u \
            albanische_kandidaten_archiv.m3u \
            deutsche_kandidaten_archiv.m3u \
            oesterreichische_kandidaten_archiv.m3u

          if git diff --cached --quiet; then
            echo "Keine Änderung"
            exit 0
          fi

          # Ergebnis als eigenen Commit festhalten. Danach neuesten main-Stand
          # darunter rebasen. So muss kein Patch auf inzwischen geänderte Dateien
          # angewendet werden.
          git commit -m "Auto v10: IPTV AL-XK DE AT aktualisiert"

          for attempt in 1 2 3; do
            echo "Push-Versuch $attempt/3"
            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase-Konflikt: Bei den generierten IPTV-Dateien gewinnt das Ergebnis dieses Laufs."
              conflicted="$(git diff --name-only --diff-filter=U)"
              if [ -z "$conflicted" ]; then
                git rebase --abort || true
                exit 1
              fi

              while IFS= read -r file; do
                [ -n "$file" ] || continue
                git checkout --theirs -- "$file"
                git add -- "$file"
              done <<< "$conflicted"

              GIT_EDITOR=true git rebase --continue
            fi

            if git push origin HEAD:main; then
              echo "Ergebnisse erfolgreich gespeichert."
              exit 0
            fi

            echo "main wurde während des Pushs erneut geändert; neuer Versuch."
            sleep 2
          done

          echo "::error::Ergebnisse konnten nach 3 Versuchen nicht gespeichert werden."
          exit 1

      - name: Status ausgeben
        if: ${{ !cancelled() }}
        run: |
          if [ "${{ steps.repair.outcome }}" = "failure" ]; then
            echo "::warning::Die Senderprüfung hatte einen Teilfehler. Vorhandene verwertbare Ergebnisse wurden trotzdem verarbeitet."
          else
            echo "IPTV Auto Repair erfolgreich abgeschlossen."
          fi
