name: IPTV 3 Länder Auto Repair

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: iptv-3-laender-master
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.12 installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ffmpeg und ffprobe installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Alle 3 Länder prüfen und reparieren
        id: repair
        continue-on-error: true
        run: python update_all.py

      - name: Ergebnisse speichern
        if: ${{ !cancelled() }}
        run: |
          git config user.name "iptv-3-laender-auto-bot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            IPTV_Samsung_AKTUELL.m3u \
            IPTV_Automatik_Report.txt \
            deutsche_sender_basis.m3u \
            oesterreichische_sender_basis.m3u \
            albanische_recovery_seed.m3u \
            albanische_kandidaten_archiv.m3u \
            deutsche_kandidaten_archiv.m3u \
            oesterreichische_kandidaten_archiv.m3u

          if git diff --cached --quiet; then
            echo "Keine Änderung"
            exit 0
          fi

          # Änderungen lokal sichern, neuesten main-Stand holen und danach sauber anwenden.
          git diff --cached --binary > /tmp/iptv-changes.patch
          git reset --hard HEAD
          git pull --rebase origin main
          git apply --index /tmp/iptv-changes.patch

          if git diff --cached --quiet; then
            echo "Nach Synchronisierung keine Änderung mehr nötig"
          else
            git commit -m "Auto v10: IPTV AL-XK DE AT aktualisiert"
            git push origin HEAD:main
          fi

      - name: Status ausgeben
        if: ${{ !cancelled() }}
        run: |
          if [ "${{ steps.repair.outcome }}" = "failure" ]; then
            echo "::warning::Die Senderprüfung hatte einen Teilfehler. Vorhandene verwertbare Ergebnisse wurden trotzdem verarbeitet."
          else
            echo "IPTV Auto Repair erfolgreich abgeschlossen."
          fi
